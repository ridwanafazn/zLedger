# ============================================================================
# FinLedger Engine - CI Pipeline (GitHub Actions)
# Runs on every push and pull request.
# ============================================================================
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Runner Docker menolak API < 1.40; paksa docker-java memakai versi baru
      DOCKER_API_VERSION: "1.43"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finledger
          POSTGRES_USER: finledger
          POSTGRES_PASSWORD: finledger_dev_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finledger -d finledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Validate Maven wrapper / Maven version
        run: mvn --version

      - name: Build and run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: finledger
          DB_USERNAME: finledger
          DB_PASSWORD: finledger_dev_secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_PROFILES_ACTIVE: dev
          JWT_SECRET: ci-only-secret-key-with-at-least-32-bytes-1234
          ADMIN_PASSWORD: admin123
          MERCHANT_PASSWORD: merchant123
          CUSTOMER_PASSWORD: customer123
        run: mvn clean verify -B

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: target/surefire-reports/

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: target/failsafe-reports/

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: OWASP Dependency-Check (advisory)
        continue-on-error: true
        run: mvn -B -Psecurity-scan -DskipTests verify

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -t finledger-engine:${{ github.sha }} .
          echo "Image built: finledger-engine:${{ github.sha }}"