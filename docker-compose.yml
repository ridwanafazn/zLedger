# ============================================================================
# FinLedger Engine - Local Infrastructure (Docker Compose)
# Spins up PostgreSQL, Redis, and Apache Kafka (KRaft mode) for development.
# ============================================================================
services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16 - Primary database for double-entry ledger
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: finledger-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-finledger}
      POSTGRES_USER: ${DB_USERNAME:-finledger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finledger_dev_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - finledger_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-finledger} -d ${DB_NAME:-finledger}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finledger-net

  # --------------------------------------------------------------------------
  # Redis 7 - Caching, distributed locking, idempotency store
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: finledger-redis
    command: >
      sh -c "redis-server --save '' --appendonly no
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - finledger_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finledger-net

  # --------------------------------------------------------------------------
  # Apache Kafka (KRaft mode - no separate Zookeeper required)
  # --------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: finledger-kafka
    environment:
      # KRaft configuration
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      # Topic auto-creation (dev convenience; disable in prod)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: oolb5PTbW0GZH0uh5yBQvw
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    depends_on:
      - redis
    healthcheck:
      # cp-kafka menyediakan script di /usr/bin tanpa akhiran .sh
      test: ["CMD-SHELL", "/usr/bin/kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - finledger-net

  # --------------------------------------------------------------------------
  # S3-compatible object storage untuk bukti bayar (Fase J)
  # S3Mock dipakai karena image minio/minio tidak tersedia di environment ini.
  # Untuk MinIO, ganti image dengan `minio/minio` + command `server /data`
  # dan set STORAGE_ENDPOINT=http://localhost:9000 — API-nya sama (S3).
  # --------------------------------------------------------------------------
  s3mock:
    image: adobe/s3mock:3.5.2
    container_name: finledger-s3mock
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${STORAGE_BUCKET:-finledger-proofs}
    ports:
      - "9091:9090"
    networks:
      - finledger-net

  # --------------------------------------------------------------------------
  # Prometheus - scraping /actuator/prometheus (Fase K)
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: finledger-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - finledger-net

  # --------------------------------------------------------------------------
  # Grafana - dashboard FinLedger (datasource & dashboard auto-provisioned)
  # http://localhost:3000 (admin / admin)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.2
    container_name: finledger-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - finledger_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - finledger-net

# --------------------------------------------------------------------------
# Named volumes
# --------------------------------------------------------------------------
volumes:
  finledger_postgres_data:
  finledger_redis_data:
  finledger_grafana_data:

# --------------------------------------------------------------------------
# Network
# --------------------------------------------------------------------------
networks:
  finledger-net:
    driver: bridge