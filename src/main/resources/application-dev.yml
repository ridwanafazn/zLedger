# ============================================================================
# FinLedger Engine - Development Profile
# ============================================================================

spring:
  profiles:
    active: dev

  datasource:
    hikari:
      maximum-pool-size: 10

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true

  data.redis:
    lettuce:
      shutdown-timeout: 200ms

server:
  port: 8080

logging:
  level:
    root: INFO
    com.alfagift.finledger: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env