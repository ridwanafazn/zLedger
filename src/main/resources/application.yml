# ============================================================================
# FinLedger Engine - Base Application Configuration
# Profile-agnostic values go here. Environment-specific values live in
# application-dev.yml / application-prod.yml.
# ============================================================================

spring:
  application:
    name: finledger-engine

  # --- Datasource (PostgreSQL) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finledger}
    username: ${DB_USERNAME:finledger}
    password: ${DB_PASSWORD:finledger_dev_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        order_inserts: true
        order_updates: true
        jdbc.batch_size: 20

  # --- Redis ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        shutdown-timeout: 200ms

  # --- Kafka ---
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: finledger-engine
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: "com.alfagift.finledger.domain,com.alfagift.finledger.infrastructure.kafka"

# --- Server ---
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never        # Do not leak exception messages to client by default
    include-binding-errors: never
    include-stacktrace: never

# --- Springdoc OpenAPI 3 (Swagger) ---
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  packages-to-scan: com.alfagift.finledger.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# --- Actuator (Production Monitoring) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# --- Logging ---
logging:
  level:
    root: INFO
    com.alfagift.finledger: DEBUG
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"